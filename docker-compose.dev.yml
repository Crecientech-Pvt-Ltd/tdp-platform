name: tdp-pdnet
services:
  # API Gateway - Nginx Reverse Proxy
  api-gateway:
    build:
      context: nginx
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - nestjs
      # - frontend
      - gsea
    networks:
      - tdp-pdnet-network

  neo4j:
    image: neo4j:5.26-enterprise
    container_name: neo4j
    restart: always
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_memory_transaction_total_max=0
      - NEO4J_dbms_security_procedures_unrestricted=gds*
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - ./scripts:/var/lib/neo4j/import/
      - ../neo4j/data:/var/lib/neo4j/data
    ports:
      - "7474:7474"
      - "7473:7473"
      - "7687:7687"
    networks:
      - tdp-pdnet-network

  nestjs:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: nestjs
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      - neo4j
      - clickhouse
      - redis
      - postgres
    env_file:
      - backend/.env
    environment:
      - DATA_COMMONS_PATH=/mnt
    volumes:
      - "C:/Users/gargm/Downloads/data:/mnt"
    networks:
      - tdp-pdnet-network

  # frontend:
  #   build:
  #     context: frontend
  #     dockerfile: Dockerfile
  #   container_name: frontend
  #   restart: always
  #   ports:
  #     - "3000:80"
  #   env_file:
  #     - frontend/.env
  #   networks:
  #     - tdp-pdnet-network

  gsea:
    build:
      context: gsea
      dockerfile: Dockerfile
    container_name: gsea
    restart: always
    ports:
      - "5000:5000"
    networks:
      - tdp-pdnet-network

  redis:
    image: redis:8.2-alpine
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-cache:/data
    networks:
      - tdp-pdnet-network

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse
    restart: always
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./scripts/data/backup:/backup
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    networks:
      - tdp-pdnet-network

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tdp-pdnet-network

volumes:
  redis-cache:
  clickhouse-data:
  postgres-data:

networks:
  tdp-pdnet-network:
    driver: bridge